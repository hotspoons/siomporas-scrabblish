# Build, test and deploy to Cloudflare Workers (scrabbleish.siomporas.com).
# Repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# The API token needs Workers Scripts: Edit, D1: Edit and, on the siomporas.com
# zone, Zone: Read / DNS: Edit / Workers Routes: Edit.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Find or create the D1 database and put its real id in wrangler.jsonc.
      - name: Ensure D1 database
        run: node scripts/ci-d1.mjs
      - name: Apply D1 migrations
        # Wrangler 4.158 removed --yes: it skips the confirmation prompt when it
        # detects CI, and still takes a backup before applying.
        run: npx wrangler d1 migrations apply scrabbleish --remote
      # wrangler is pinned in package.json (4.158.0). 4.165.x queries the newer
      # worker-scoped subdomain API after upload, which answers 10007 on this
      # account even though the deploy itself succeeded, so the action fails.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
